apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/nasir17git/logonme
    targetRevision: demo-env
    path: deploy/apps/petclinic
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic