# loki:
#   auth_enabled: false
#   commonStorageConfig: |
#     filesystem:
#       chunks_directory: /loki/chunks
#       rules_directory: /loki/rules

# deploymentMode: SingleBinary

# # https://github.com/grafana/loki/issues/8443
# loki:
#   auth_enabled: false
#   commonConfig:
#     replication_factor: 1
#   storage:
#     type: 'filesystem'
# singleBinary:
#   replicas: 1
# You have more than zero replicas configured for both the single binary and simple scalable targets. If this was intentional change the deploymentMode to the transitional 'SingleBinary<->SimpleScalable' mode

# https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  # commonConfig:
  #   replication_factor: 1
  storage:
    type: s3
  schemaConfig:
    configs:
    - from: 2024-01-01
      store: tsdb
      index:
        prefix: loki_index_
        period: 24h
      object_store: s3
      schema: v13
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4
  # limits_config:
  #   allow_structured_metadata: true
  #   max_global_streams_per_user: 0
  # retention https://grafana.com/docs/loki/latest/operations/storage/retention/#table-manager-deprecated
  compactor:
    retention_enabled: true
    delete_request_store: s3

lokiCanary:
  enabled: false
test:
  enabled: false
read:
  replicas: 2
backend:
  replicas: 2
write:
  replicas: 2

minio:
  enabled: true

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0