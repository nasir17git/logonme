# helm repo add opentelemetry-helm https://open-telemetry.github.io/opentelemetry-helm-charts
# helm upgrade otel-collector opentelemetry-helm/opentelemetry-collector --version 0.89.0 -n monitoring -f deploy/addons/base/observability/otel/collector.yaml -i
# https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector/0.89.0

fullnameOverride: collector-otel

mode: "deployment"

image:
  repository: "otel/opentelemetry-collector-contrib"

ports:
  metrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus/collector:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888

  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    otlphttp/metrics:
      endpoint: http://prometheus-server.monitoring:80/api/v1/otlp
      tls:
        insecure: true
    otlphttp/traces:
      endpoint: http://tempo-distributor-discovery.monitoring:4318
      tls:
        insecure: true
    otlphttp/logs:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local:80/otlp
      tls:
        insecure: true
    logging/metrics:
      verbosity: detailed
    logging/traces:
      verbosity: detailed
    logging/logs:
      verbosity: detailed
  
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    pprof:
    zpages:
      endpoint: "0.0.0.0:55679"
  
  service:
    extensions: [health_check, pprof, zpages]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/traces,logging/traces]
      metrics:
        receivers: [otlp,prometheus/collector]
        processors: [batch]
        exporters: [otlphttp/metrics,logging/metrics]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlphttp/logs,logging/logs]

clusterRole:
  create: true
  rules: 
  - apiGroups:
    - '*'
    resources:
    - '*'
    verbs:
    - 'get'
    - 'list'
    - 'watch'

