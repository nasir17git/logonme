# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade grafana grafana/grafana -f deploy/addons/base/observability/grafana/grafana.yaml -n monitoring -i
# https://artifacthub.io/packages/helm/grafana/grafana/7.2.5

# prometheus 먼저 깔아야한다
# Error: unable to build kubernetes objects from release manifest: resource mapping not found for name: "grafana" namespace: "monitoring" from "": no matches for kind "ServiceMonitor" in version "monitoring.coreos.com/v1"
#ensure CRDs are installed first
# adminUser: admin 
# adminPassword: admin
defaultDashboardsTimezone: Asia/Seoul

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
#   datasources:
#     enabled: true
#     defaultDatasourceEnabled: true
#     isDefaultDatasource: true
#     uid: prometheus
#     createPrometheusReplicasDatasources: false
#     label: grafana_datasource
#     labelValue: '1'
#     # url: http://prometheus-stack-prometheus:9090/

env:
  GF_AUTH_ANONYMOUS_ENABLED: true
  GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
  GF_AUTH_DISABLE_LOGIN_FORM: true
  GF_FEATURE_TOGGLES_ENABLE: traceqlEditor

service:
  portName: http-web
  type: LoadBalancer

serviceMonitor:
  enabled: true
  path: '/metrics'
  interval: ''
  scheme: http
  tlsConfig: {}
  scrapeTimeout: 30s
persistence:
  enabled: true
  type: pvc
  accessModes:
  - ReadWriteOnce
  size: 10Gi

datasources: 
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus-server.monitoring:80
        basicAuth: false
        isDefault: true
        version: 1
        editable: true
        jsonData:
          httpMethod: GET
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        orgId: 1
        url: http://loki-gateway.monitoring.svc.cluster.local
        basicAuth: false
        isDefault: false
        version: 1
        editable: true
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: traceID
              matcherType: label
              name: Trace ID
              url: $${__value.raw}
              urlDisplayLabel: View Trace
      - name: Tempo
        type: tempo
        access: proxy
        orgId: 1
        url: http://tempo-query-frontend.monitoring:3100
        basicAuth: false
        isDefault: false
        version: 1
        editable: true
        apiVersion: 1
        uid: tempo
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: true
            tags:
              - key: service.name
                value: app
            customQuery: true
            query: '{$${__tags}} |="$${__trace.traceId}" '
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default
    - name: 'msa'
      orgId: 1
      folder: 'msa'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/msa
    - name: 'grafana-dashboards-kubernetes'
      orgId: 1
      folder: 'Kubernetes'
      type: file
      disableDeletion: true
      editable: false
      options:
        path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes

dashboards:
  grafana-dashboards-kubernetes:
    k8s-system-api-server:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
      token: ''
    k8s-system-coredns:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
      token: ''
    k8s-views-global:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
      token: ''
    k8s-views-namespaces:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
      token: ''
    k8s-views-nodes:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
      token: ''
    k8s-views-pods:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
      token: ''
