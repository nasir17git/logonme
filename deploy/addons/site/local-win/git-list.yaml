# https://github.com/argoproj/applicationset/blob/master/examples/matrix/list-and-git.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-git
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
        - git:
            repoURL: https://github.com/nasir17git/logonme.git
            revision: demo-env
            directories:
            - path: deploy/addons/base/observability/*
            - path: deploy/addons/base/network/*
            # - path: kube-infra/kustomize/ci-cd/*
            # - path: kube-infra/kustomize/backup/*
            # - path: kube-infra/kustomize/dns-infra/*
            # - path: kube-infra/kustomize/database/*
            # - path: kube-infra/kustomize/observability/*
            # - path: kube-infra/kustomize/security/*
        - list:
            elements:
            - cluster: local-win
              url: https://kubernetes.default.svc
              values:
                project: dev
        #   - cluster: engineering-prod
        #     url: https://2.4.6.8
        #     values:
        #       project: prod
        # - list:
        #     elements:
        #     - cluster: demo-syd
        #       url: https://1.2.3.4
        #       values:
        #         CLIENT_ENVIRONMENT: '{{ cluster }}'
        #         DEPLOY_ENV: '{{ cluster }}'
        #         REGION: syd
        #         CI_COMMIT_REF_SLUG: '{{ branch }}'
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: 'apps'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      destination:
        server: '{{url}}'
        namespace: argocd
      source:
        repoURL: https://github.com/nasir17git/logonme.git
        targetRevision: demo-env
        path: '{{path}}'

